<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Крила — калькулятор</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f5f8; --card:#ffffff; --field:#f7f8fa;
    --line:#e6e8ee; --line-2:#d5d9e2;
    --ink:#12151c; --muted:#6b7280; --faint:#a1a7b3;
    --accent:#3b5bfd; --accent-soft:rgba(59,91,253,.10);
    --minus:#0ea5e9; --base:#f59e0b; --plus:#10b981; --avg:#8b5cf6;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -8px rgba(16,24,40,.10);
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --bar-h:68px;
    /* кольори логотипів на фоні — світла тема */
    --l1:#3b5bfd; --l2:#8b5cf6; --l3:#10b981; --l4:#f59e0b; --l5:#ef4444; --l6:#0ea5e9; --l7:#ec4899;
    --logo-op:.16;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0b0d12; --card:#14171f; --field:#1b1f29;
    --line:#252a36; --line-2:#323846;
    --ink:#eef0f4; --muted:#9aa2b1; --faint:#5f6776;
    --accent:#6b85ff; --accent-soft:rgba(107,133,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
    /* кольори логотипів на фоні — темна тема */
    --l1:#7c93ff; --l2:#c4a6ff; --l3:#4ff0b0; --l4:#ffc94d; --l5:#ff7a7a; --l6:#5fd4ff; --l7:#ff8fd0;
    --logo-op:.22;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding:calc(var(--bar-h) + 24px) 16px 32px;
    transition:background .2s, color .2s;
  }

  /* ── логотипи, що літають на фоні ── */
  .sky{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .logo{
    position:absolute; left:0; top:0; width:var(--s); aspect-ratio:260/280;
    background:var(--c); opacity:var(--logo-op);
    -webkit-mask:var(--logo-img) center/contain no-repeat; mask:var(--logo-img) center/contain no-repeat;
    transition:background .4s, opacity .4s; will-change:transform;
  }

  /* ── закріплена панель вкладок ── */
  .bar{
    position:fixed; top:0; left:0; right:0; z-index:10; height:var(--bar-h);
    display:flex; align-items:center; justify-content:center; gap:10px; padding:0 12px;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    border-bottom:1px solid var(--line);
    backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
  }
  .seg{
    display:flex; gap:4px; padding:4px; width:min(480px,100%);
    background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  }
  .tab{
    flex:1 1 0; min-width:0; height:40px; border:0; border-radius:10px;
    background:transparent; color:var(--muted); cursor:pointer;
    font:600 .95rem var(--sans); letter-spacing:-.01em; white-space:nowrap;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:background .15s, color .15s;
  }
  .tab .n{font-family:var(--mono); font-weight:600;}
  .tab:hover{color:var(--ink); background:var(--field);}
  .tab[aria-selected="true"]{background:var(--ink); color:var(--card);}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .theme{
    flex:none; width:44px; height:44px; border-radius:12px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--muted); box-shadow:var(--shadow);
    display:grid; place-items:center;
  }
  .theme:hover{color:var(--ink);}
  .theme svg{width:20px; height:20px;}
  .theme .moon{display:none;}
  :root[data-theme="dark"] .theme .sun{display:none;}
  :root[data-theme="dark"] .theme .moon{display:block;}

  /* ── картка ── */
  .card{
    position:relative; z-index:1;
    width:min(480px,100%); margin:0 auto;
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:24px; box-shadow:var(--shadow);
  }
  .card[hidden]{display:none;}
  .head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:20px;}
  .head h1{margin:0; font-size:1.35rem; font-weight:700; letter-spacing:-.02em;}
  .head span{color:var(--muted); font-size:.9rem;}

  .grid{display:grid; grid-template-columns:1fr 120px; gap:12px;}
  .grid.two{grid-template-columns:1fr 1fr;}
  label{display:block; color:var(--muted); font-size:.8rem; font-weight:500; margin:0 0 6px 2px;}
  .field{
    display:flex; align-items:center; gap:10px; height:58px; padding:0 16px;
    background:var(--field); border:1px solid var(--line); border-radius:14px;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .field:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); background:var(--card);}
  .field .tag{color:var(--faint); font:600 1rem var(--mono);}
  input{
    width:100%; min-width:0; border:0; background:transparent; color:var(--ink); outline:none;
    font:600 1.45rem var(--mono); font-variant-numeric:tabular-nums;
  }
  .grid .small input{font-size:1.15rem;}
  input::placeholder{color:var(--faint); font-weight:500;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}

  /* ── результати ── */
  .out{display:grid; gap:10px; margin-top:20px;}
  .row{
    display:flex; align-items:center; gap:14px; padding:14px 16px 14px 14px;
    border:1px solid var(--line); border-radius:16px; background:var(--card);
    cursor:pointer; user-select:none; transition:border-color .15s, background .15s, transform .08s;
  }
  .row:hover{border-color:var(--line-2); background:var(--field);}
  .row:active{transform:scale(.99);}
  .badge{
    flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    font:700 1.05rem var(--mono); color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent);
  }
  .row .lbl{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .row .lbl b{font-weight:600; font-size:.95rem;}
  .row .lbl small{color:var(--muted); font:500 .85rem var(--mono);}
  .row .v{
    margin-left:auto; font:600 1.9rem var(--mono); letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; user-select:all; -webkit-user-select:all;
  }
  .row .cp{flex:none; width:18px; height:18px; color:var(--faint); transition:color .15s;}
  .row:hover .cp{color:var(--muted);}
  .row.x{--c:var(--minus);} .row.y{--c:var(--base);} .row.z{--c:var(--plus);} .row.avg{--c:var(--avg);}
  .row.avg{padding:20px 18px 20px 16px;}
  .row.avg .v{font-size:2.5rem;}
  .row.flash{border-color:var(--c); background:color-mix(in srgb,var(--c) 8%,var(--card));}

  .toast{
    position:fixed; left:50%; bottom:24px; z-index:20; transform:translate(-50%,16px); opacity:0;
    background:var(--ink); color:var(--card); border-radius:12px; padding:10px 16px;
    font:500 .95rem var(--sans); pointer-events:none; box-shadow:var(--shadow);
    transition:opacity .18s, transform .18s;
  }
  .toast b{font-family:var(--mono);}
  .toast.on{opacity:1; transform:translate(-50%,0);}

  @media (max-width:440px){
    .card{padding:18px; border-radius:18px;}
    .grid,.grid.two{grid-template-columns:1fr 1fr;}
    .grid:not(.two){grid-template-columns:1fr 96px;}
    .row .v{font-size:1.6rem;}
    .row.avg .v{font-size:2rem;}
    .tab{font-size:.88rem;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<nav class="bar">
  <div class="seg" role="tablist" aria-label="Режими">
    <button class="tab" role="tab" id="tab-1" aria-controls="p-1" aria-selected="true"><span class="n">±<span id="tabOff1">450</span></span></button>
    <button class="tab" role="tab" id="tab-2" aria-controls="p-2" aria-selected="false" tabindex="-1"><span class="n">±<span id="tabOff2">500</span></span></button>
    <button class="tab" role="tab" id="tab-3" aria-controls="p-3" aria-selected="false" tabindex="-1">Середнє</button>
  </div>
  <button class="theme" id="theme" aria-label="Змінити тему" title="Світла / темна тема">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</nav>

<!-- іконка копіювання (перевикористовується) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
</svg>

<!-- ── Вкладка 1: ±зсув (450) ── -->
<main class="card" id="p-1" role="tabpanel" aria-labelledby="tab-1">
  <div class="head"><h1>Крила</h1><span>Зсув ±<span class="offTxt">450</span></span></div>
  <div class="grid">
    <div>
      <label for="y1">Базове значення</label>
      <div class="field"><span class="tag">Y</span><input id="y1" class="y" type="number" inputmode="numeric" placeholder="1500" autocomplete="off" /></div>
    </div>
    <div class="small">
      <label for="off1">Зсув</label>
      <div class="field"><span class="tag">±</span><input id="off1" class="off" type="number" inputmode="numeric" value="450" autocomplete="off" /></div>
    </div>
  </div>
  <div class="out">
    <div class="row x"><span class="badge">X</span><span class="lbl"><small class="fm">−450</small></span><span class="v vx">—</span><svg class="cp"><use href="#i-copy"/></svg></div>
    <div class="row y"><span class="badge">Y</span><span class="lbl"></span><span class="v vy">—</span><svg class="cp"><use href="#i-copy"/></svg></div>
    <div class="row z"><span class="badge">Z</span><span class="lbl"><small class="fp">+450</small></span><span class="v vz">—</span><svg class="cp"><use href="#i-copy"/></svg></div>
  </div>
</main>

<!-- ── Вкладка 2: ±зсув (500) ── -->
<main class="card" id="p-2" role="tabpanel" aria-labelledby="tab-2" hidden>
  <div class="head"><h1>Крила</h1><span>Зсув ±<span class="offTxt">500</span></span></div>
  <div class="grid">
    <div>
      <label for="y2">Базове значення</label>
      <div class="field"><span class="tag">Y</span><input id="y2" class="y" type="number" inputmode="numeric" placeholder="1500" autocomplete="off" /></div>
    </div>
    <div class="small">
      <label for="off2">Зсув</label>
      <div class="field"><span class="tag">±</span><input id="off2" class="off" type="number" inputmode="numeric" value="500" autocomplete="off" /></div>
    </div>
  </div>
  <div class="out">
    <div class="row x"><span class="badge">X</span><span class="lbl"><small class="fm">−500</small></span><span class="v vx">—</span><svg class="cp"><use href="#i-copy"/></svg></div>
    <div class="row y"><span class="badge">Y</span><span class="lbl"></span><span class="v vy">—</span><svg class="cp"><use href="#i-copy"/></svg></div>
    <div class="row z"><span class="badge">Z</span><span class="lbl"><small class="fp">+500</small></span><span class="v vz">—</span><svg class="cp"><use href="#i-copy"/></svg></div>
  </div>
</main>

<!-- ── Вкладка 3: середнє ── -->
<main class="card" id="p-3" role="tabpanel" aria-labelledby="tab-3" hidden>
  <div class="head"><h1>Крила</h1><span>Середнє значення</span></div>
  <div class="grid two">
    <div>
      <label for="a">Перше число</label>
      <div class="field"><span class="tag">А</span><input id="a" type="number" inputmode="numeric" placeholder="1000" autocomplete="off" /></div>
    </div>
    <div>
      <label for="b">Друге число</label>
      <div class="field"><span class="tag">Б</span><input id="b" type="number" inputmode="numeric" placeholder="1500" autocomplete="off" /></div>
    </div>
  </div>
  <div class="out">
    <div class="row avg"><span class="lbl"><b>Результат</b></span><span class="v" id="vavg">—</span><svg class="cp"><use href="#i-copy"/></svg></div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* числа без пробілів між розрядами — щоб зручно копіювати */
  function fmt(n){ return String(Math.round(n)); }

  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

  /* ── тема ── */
  var root=document.documentElement;
  if(store('kryla-theme')==='dark') root.setAttribute('data-theme','dark');
  document.getElementById('theme').addEventListener('click',function(){
    var dark=root.getAttribute('data-theme')!=='dark';
    if(dark) root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
    store('kryla-theme',dark?'dark':'light');
  });

  /* плавна зміна числа в елементі */
  function counter(el){
    var cur=0, raf;
    return {
      set:function(to){
        if(reduce){ cur=to; el.textContent=fmt(to); return; }
        cancelAnimationFrame(raf);
        var from=cur, t0=performance.now(), dur=320;
        function step(now){
          var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
          cur=from+(to-from)*e; el.textContent=fmt(cur);
          if(p<1) raf=requestAnimationFrame(step);
        }
        raf=requestAnimationFrame(step);
      },
      clear:function(){ cancelAnimationFrame(raf); cur=0; el.textContent='—'; }
    };
  }

  /* ── вкладки 1 і 2: ±зсув ── */
  [1,2].forEach(function(i){
    var p=document.getElementById('p-'+i);
    var yEl=p.querySelector('.y'), offEl=p.querySelector('.off');
    var tabOff=document.getElementById('tabOff'+i), offTxt=p.querySelector('.offTxt');
    var fm=p.querySelector('.fm'), fp=p.querySelector('.fp');
    var out={x:counter(p.querySelector('.vx')), y:counter(p.querySelector('.vy')), z:counter(p.querySelector('.vz'))};
    var saved=store('kryla-off'+i);
    if(saved!==null && saved!=='') offEl.value=saved;

    function calc(){
      var off=parseFloat(offEl.value)||0;
      tabOff.textContent=offTxt.textContent=fmt(off);
      fm.textContent='−'+fmt(off); fp.textContent='+'+fmt(off);
      var yRaw=yEl.value.trim();
      if(yRaw===''){ out.x.clear(); out.y.clear(); out.z.clear(); return; }
      var y=parseFloat(yRaw)||0;
      out.x.set(y-off); out.y.set(y); out.z.set(y+off);
    }
    yEl.addEventListener('input',calc);
    offEl.addEventListener('input',function(){ store('kryla-off'+i, offEl.value.trim()); calc(); });
    calc();
  });

  /* ── вкладка 3: середнє ── */
  var aEl=document.getElementById('a'), bEl=document.getElementById('b');
  var avg=counter(document.getElementById('vavg'));
  function calcAvg(){
    var ar=aEl.value.trim(), br=bEl.value.trim();
    if(ar===''||br===''){ avg.clear(); return; }
    var a=parseFloat(ar)||0, b=parseFloat(br)||0;
    avg.set(Math.round((a+b)/2));
  }
  aEl.addEventListener('input',calcAvg); bEl.addEventListener('input',calcAvg);

  /* ── клік по рядку — копіювання числа ── */
  var toast=document.getElementById('toast'), toastT;
  function notify(t){ toast.innerHTML='Скопійовано <b></b>'; toast.lastChild.textContent=t; toast.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ toast.classList.remove('on'); },1200); }
  function legacyCopy(t){
    var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
  }
  function copyText(t){
    if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t).catch(function(){ legacyCopy(t); });
    legacyCopy(t); return Promise.resolve();
  }
  [].forEach.call(document.querySelectorAll('.row'),function(row){
    var v=row.querySelector('.v'); row.title='Натисни, щоб скопіювати';
    row.addEventListener('click',function(){
      var t=v.textContent.trim(); if(t==='—') return;
      copyText(t).then(function(){
        notify(t); row.classList.add('flash'); setTimeout(function(){ row.classList.remove('flash'); },400);
      });
    });
  });

  /* ── логотипи на фоні: повільно літають і відбиваються від країв ── */
  (function(){
    var sky=document.getElementById('sky'), items=[], N=7;
    for(var i=0;i<N;i++){
      var el=document.createElement('div'); el.className='logo';
      var size=70+Math.random()*90;
      el.style.setProperty('--s',size+'px'); el.style.setProperty('--c','var(--l'+(i%7+1)+')');
      sky.appendChild(el);
      var ang=Math.random()*Math.PI*2, sp=18+Math.random()*22; /* px/сек */
      items.push({el:el, w:size, h:size*280/260,
        x:Math.random()*(innerWidth-size), y:Math.random()*(innerHeight-size),
        vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        r:Math.random()*360, vr:(Math.random()<.5?-1:1)*(6+Math.random()*14)});
    }
    function place(it){ it.el.style.transform='translate('+it.x+'px,'+it.y+'px) rotate('+it.r+'deg)'; }
    items.forEach(place);
    if(reduce) return;
    var last=performance.now();
    function tick(now){
      var dt=Math.min(.05,(now-last)/1000); last=now;
      var W=innerWidth, H=innerHeight;
      items.forEach(function(it){
        it.x+=it.vx*dt; it.y+=it.vy*dt; it.r+=it.vr*dt;
        if(it.x<-it.w*.2){ it.x=-it.w*.2; it.vx=Math.abs(it.vx); }
        if(it.x>W-it.w*.8){ it.x=W-it.w*.8; it.vx=-Math.abs(it.vx); }
        if(it.y<-it.h*.2){ it.y=-it.h*.2; it.vy=Math.abs(it.vy); }
        if(it.y>H-it.h*.8){ it.y=H-it.h*.8; it.vy=-Math.abs(it.vy); }
        place(it);
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* ── перемикання вкладок ── */
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var firstInput={1:'y1',2:'y2',3:'a'};
  function show(i){
    tabs.forEach(function(t,k){
      var on=(k+1)===i;
      t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1;
      document.getElementById('p-'+(k+1)).hidden=!on;
    });
    store('kryla-tab',i);
    var el=document.getElementById(firstInput[i]); el.focus(); el.select&&el.select();
  }
  tabs.forEach(function(t,k){ t.addEventListener('click',function(){ show(k+1); }); });
  /* Alt+1/2/3 або 1/2/3 коли курсор не в полі — швидке перемикання */
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&document.activeElement.tagName==='INPUT'){ document.activeElement.select(); return; }
    var n=parseInt(e.key,10); if(!(n>=1&&n<=3)) return;
    var inField=document.activeElement&&document.activeElement.tagName==='INPUT';
    if(e.altKey||(!inField&&!e.ctrlKey&&!e.metaKey)){ e.preventDefault(); show(n); }
  });
  var startTab=parseInt(store('kryla-tab'),10);
  show(startTab>=1&&startTab<=3?startTab:1);
})();
</script>
</body>
</html>
