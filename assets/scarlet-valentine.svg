  <text x="68" y="86" font-size="56" font-family="Arial, sans-serif" fill="#ffd2da" opacity="0.96" font-weight="700">LOVE TACTICS</text>
  <text x="70" y="145" font-size="28" font-family="Arial, sans-serif" fill="#f1a3b0" opacity="0.94">14.02 // Emotion Level: Maximum</text>
